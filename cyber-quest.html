 mm0=document.createElement("canvas");mm0.width=mm0.height=120;var u=mm0.getContext("2d");u.fillStyle="#0a1240";B.forEach(function(b){u.fillRect((b.x1+140)*.4286,(b.z1+140)*.4286,(b.x2-b.x1)*.4286,(b.z2-b.z1)*.4286)});

}
function rs(){if(!R)return;R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
function start(){S.mode="play";["hl","hr","ob"].forEach(function(i){$(i).style.display=i==="hr"?"flex":"block"});$("sc").style.display="block";if(touch){$("joy").style.display="block";$("tb").style.display="flex"}$("pr").style.display="none"}
function reset(){S.xp=0;S.found={};px=0;pz=6;vy=0;py=0;frags.forEach(function(f){f.visible=true});S.frags=0}
function gain(n){S.xp=Math.min(2000,S.xp+n);beep(880,.12)}
function lvl(){return S.xp>=1500?"Root Access":S.xp>=600?"Net Runner":"Cyber Explorer"}

// ===== input =====
function bind(){
 var cv=$("cv"),lx,ly,drag=false;
 addEventListener("keydown",function(e){var k=e.key.toLowerCase();if(k===" "||k.indexOf("arrow")===0)e.preventDefault();if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){if(k==="escape")closeP();return}
  if(k==="escape"){if(S.mode==="panel")closeP();else if(S.mode==="play")pause(true);else if(S.mode==="pause")pause(false);return}
  if(k==="e"){if(S.mode==="panel")closeP();else use();return}keys[k===" "?"space":k]=true});
 addEventListener("keyup",function(e){keys[e.key===" "?"space":e.key.toLowerCase()]=false});
 cv.addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
 cv.addEventListener("pointermove",function(e){if(!drag||S.mode!=="play")return;yaw-=(e.clientX-lx)*.005;pitch=Math.max(.05,Math.min(1.2,pitch+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
 cv.addEventListener("pointerup",function(){drag=false});
 cv.addEventListener("wheel",function(e){dist=Math.max(4,Math.min(18,dist+e.deltaY*.01))},{passive:true});
 var j=$("joy"),kb=j.firstElementChild,jid=null;
 function jm(e){var r=j.getBoundingClientRect(),dx=e.clientX-(r.left+55),dy=e.clientY-(r.top+55),d=Math.hypot(dx,dy),s=d>45?45/d:1;dx*=s;dy*=s;joy.x=dx/45;joy.y=dy/45;kb.style.transform="translate("+dx+"px,"+dy+"px)"}
 j.addEventListener("pointerdown",function(e){jid=e.pointerId;j.setPointerCapture(jid);jm(e)});j.addEventListener("pointermove",function(e){if(e.pointerId===jid)jm(e)});

 $("bj").onclick=function(){jumpReq=true};$("bu").onclick=use;$("br").onclick=function(){run=!run;this.classList.toggle("on",run)};
 $("bp").onclick=function(){pause(true)};$("bm").onclick=$("p3").onclick=mute;
 $("p1").onclick=function(){pause(false)};$("p2").onclick=function(){$("pause").style.display="none";open("profile","pause")};
 $("p4").onclick=function(){reset();pause(false)};$("p5").onclick=function(){reset();$("pause").style.display="none";S.mode="intro";["hl","hr","ob","pr"].forEach(function(i){$(i).style.display="none"});$("joy").style.display=$("tb").style.display=$("sc").style.display="none";$("intro").style.display="flex"};
}
function mute(){S.mute=!S.mute;var t="Sound: "+(S.mute?"off":"on");$("bm").textContent=S.mute?"Sound off":"Sound on";$("p3").textContent=t;beep(520)}
function pause(on){S.mode=on?"pause":"play";$("pause").style.display=on?"flex":"none"}
function near(){var b=null,bd=7;MS.forEach(function(m){var d=Math.hypot(px-m.x,pz-m.z);if(d<bd){bd=d;b=m}});return b}
function use(){if(S.mode!=="play")return;var m=near();if(!m)return;if(!S.found[m.id]){S.found[m.id]=1;gain(200);toast("LOCATION DISCOVERED","+200 XP: "+m.n)}open(m.id,"play")}

// ===== loop =====
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(S.mode==="play")upd(dt,t);
 rings.forEach(function(r,i){r.rotation.z=t*(1+i*.1)});frags.forEach(function(f){f.rotation.y=t*2;f.position.y=1.3+Math.sin(t*2+f.position.x)*.2});
 if(S.mode!=="intro")R.render(scene,cam)}
function upd(dt,t){
 var ix=(keys.d?1:0)-(keys.a?1:0)+joy.x,iz=(keys.w?1:0)-(keys.s?1:0)-joy.y,l=Math.hypot(ix,iz);if(l>1){ix/=l;iz/=l;l=1}
 var sp=(keys.shift||run)?12:7,sy=Math.sin(yaw),cy=Math.cos(yaw),mx=(-sy*iz+cy*ix)*sp,mz=(-cy*iz-sy*ix)*sp;
 px+=mx*dt;pz+=mz*dt;px=Math.max(-125,Math.min(125,px));pz=Math.max(-125,Math.min(125,pz));
 for(var n=0;n<B.length;n++){var b=B[n],qx=Math.max(b.x1,Math.min(px,b.x2)),qz=Math.max(b.z1,Math.min(pz,b.z2)),dx=px-qx,dz=pz-qz,d=Math.hypot(dx,dz);if(d<.6){if(d>1e-4){px+=dx/d*(.6-d);pz+=dz/d*(.6-d)}else px=b.x1-.6}}
 if((keys.space||jumpReq)&&py===0){vy=11;beep(300,.1)}jumpReq=false;vy-=30*dt;py+=vy*dt;if(py<=0){py=0;vy=0}
 if(l>.1){var tg=Math.atan2(mx,mz),df=Math.atan2(Math.sin(tg-face),Math.cos(tg-face));face+=df*Math.min(1,dt*12);ph+=dt*sp*1.2}
 var sw=l>.1&&py===0?Math.sin(ph)*.85:0;limbs.al.rotation.x=sw;limbs.ar.rotation.x=-sw;limbs.ll.rotation.x=-sw;limbs.lr.rotation.x=sw;
 pl.position.set(px,py,pz);pl.rotation.y=face;
 var cp=Math.cos(pitch);cam.position.lerp(new THREE.Vector3(px+sy*cp*dist,py+1.8+Math.sin(pitch)*dist,pz+cy*cp*dist),Math.min(1,dt*10));cam.lookAt(px,py+1.6,pz);
 parts.geometry.attributes.position.array.forEach(function(v,i,a){if(i%3===1){a[i]-=dt*3;if(a[i]<0)a[i]=60}});parts.geometry.attributes.position.needsUpdate=true;
 frags.forEach(function(f){if(f.visible&&Math.hypot(px-f.position.x,pz-f.position.z)<2){f.visible=false;S.frags++;gain(100);toast("DATA FRAGMENT FOUND","+100 XP, "+S.frags+" of 8")}});
 var m=near();$("pr").style.display=m?"block":"none";
 var nf=Object.keys(S.found).length,nx=null,nd=1e9;MS.forEach(function(q){if(!S.found[q.id]){var d=Math.hypot(px-q.x,pz-q.z);if(d<nd){nd=d;nx=q}}});
 $("lv").textContent="Level: "+lvl();$("xp").firstChild.style.width=S.xp/20+"%";$("st").textContent="Discovered "+nf+" of 6 | Fragments "+S.frags+" of 8";
 $("obt").textContent=nx?"Locate the "+nx.n+" ("+Math.round(nd)+" m)":"All locations found. Hunt the remaining data fragments.";
 var c=$("mm").getContext("2d"),k=.4286;c.drawImage(mm0,0,0);MS.forEach(function(q){c.fillStyle=hex(q.c);c.globalAlpha=S.found[q.id]?.45:1;c.beginPath();c.arc((q.x+140)*k,(q.z+140)*k,4,0,7);c.fill()});c.globalAlpha=1;
 c.save();c.translate((px+140)*k,(pz+140)*k);c.rotate(-face+Math.PI);c.fillStyle="#fff";c.beginPath();c.moveTo(0,-6);c.lineTo(4,4);c.lineTo(-4,4);c.fill();c.restore();
}
})();
